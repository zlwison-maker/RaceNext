name: HK100 Fallback Source Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - work/hk100-trusted-fallback

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate HK100 trusted fallback candidates
        run: node scripts/race-update/hk100FallbackDiagnostic.ts
