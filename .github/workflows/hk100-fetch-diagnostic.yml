name: HK100 Runner Fetch Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - work/hk100-runner-fetch-diagnosis

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnosis branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose HK100 official-source fetches
        run: node scripts/race-update/hk100FetchDiagnostic.ts
