name: Race Data Update

on:
  workflow_dispatch:
  schedule:
    # 08:23 Asia/Shanghai (UTC+8). GitHub scheduled workflows use UTC.
    - cron: '23 0 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: race-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # All executable code comes from trusted main. Open PRs supply validated data only.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare continuous monitoring baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/race-update/productionPrContinuityCli.ts prepare

      - name: Validate provider secrets
        shell: bash
        env:
          FACT_EXTRACTION_PROVIDER: ${{ secrets.FACT_EXTRACTION_PROVIDER }}
          FACT_EXTRACTION_API_KEY: ${{ secrets.FACT_EXTRACTION_API_KEY }}
          FACT_EXTRACTION_MODEL: ${{ secrets.FACT_EXTRACTION_MODEL }}
          FACT_EXTRACTION_BASE_URL: ${{ secrets.FACT_EXTRACTION_BASE_URL }}
        run: |
          missing=0
          for name in FACT_EXTRACTION_PROVIDER FACT_EXTRACTION_API_KEY FACT_EXTRACTION_MODEL FACT_EXTRACTION_BASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is not configured"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo "PROVIDER_CONFIGURED=yes"
          echo "MODEL=${FACT_EXTRACTION_MODEL}"

      - name: Run 12-race production manual check
        id: pipeline
        env:
          FACT_EXTRACTION_PROVIDER: ${{ secrets.FACT_EXTRACTION_PROVIDER }}
          FACT_EXTRACTION_API_KEY: ${{ secrets.FACT_EXTRACTION_API_KEY }}
          FACT_EXTRACTION_MODEL: ${{ secrets.FACT_EXTRACTION_MODEL }}
          FACT_EXTRACTION_BASE_URL: ${{ secrets.FACT_EXTRACTION_BASE_URL }}
        run: npm run race:check:production -- --auto-apply-low-risk=false

      - name: Enforce data-only diff
        run: npm run race:gate:data-only

      - name: Scan generated output for secrets
        env:
          FACT_EXTRACTION_PROVIDER: ${{ secrets.FACT_EXTRACTION_PROVIDER }}
          FACT_EXTRACTION_API_KEY: ${{ secrets.FACT_EXTRACTION_API_KEY }}
          FACT_EXTRACTION_MODEL: ${{ secrets.FACT_EXTRACTION_MODEL }}
          FACT_EXTRACTION_BASE_URL: ${{ secrets.FACT_EXTRACTION_BASE_URL }}
        run: npm run race:gate:secret-scan

      - name: Upload sanitized report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pipeline.outputs.artifact_name }}
          path: ${{ steps.pipeline.outputs.report_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Run pipeline directed tests
        run: node --test --experimental-strip-types tests/raceUpdate*.test.ts

      - name: Run full test suite
        run: npm test

      - name: Run Public Fact Gate
        run: node --test --experimental-strip-types tests/raceGraphPublic.test.ts tests/launchBatchSeven.test.ts

      - name: Run TypeScript gates
        run: |
          npm run typecheck
          npm run typecheck:miniprogram
          npm run lint

      - name: Check patch whitespace
        run: git diff --check

      - name: Safely continue or create the single data PR
        env:
          GH_TOKEN: ${{ github.token }}
          MEANINGFUL_DATA_CHANGE: ${{ steps.pipeline.outputs.meaningful_data_change }}
          PR_BODY_PATH: ${{ steps.pipeline.outputs.pr_body_path }}
          ARTIFACT_NAME: ${{ steps.pipeline.outputs.artifact_name }}
          NEW_PENDING_COUNT: ${{ steps.pipeline.outputs.new_pending_count }}
          DEDUPED_PENDING_COUNT: ${{ steps.pipeline.outputs.deduped_pending_count }}
        run: node scripts/race-update/productionPrContinuityCli.ts finish

      - name: Report failed monitoring or blocked write
        if: failure()
        run: echo "CHECK_FAILED; inspect prior step for WRITE_BLOCKED or PARTIAL_SUCCESS and whether the Data PR branch was already updated." >> "$GITHUB_STEP_SUMMARY"
